let currentDate =

function getTasks(subject){

if(subject==="Physics"){
return physicsTasks;
}

if(subject==="Chemistry"){
return chemistryTasks;
}

return biologyTasks;

}

function getKey(
subject,
chapter,
task
){

return `${subject}_${chapter}_${task}`;

}

function updateProgress(){

let total = 0;
let done = 0;

for(let subject in allSubjects){

allSubjects[subject]
.forEach(ch=>{

getTasks(subject)
.forEach(task=>{

total++;

if(
localStorage.getItem(
getKey(subject,ch,task)
)
){
done++;
}

});

});

}

const percent =
((done/total)*100)
.toFixed(2);

const bar =
document.getElementById(
"progressBar"
);

if(bar){

bar.style.width =
percent + "%";

}

const text =
document.getElementById(
"progressText"
);

if(text){

text.innerText =
percent + "% Completed";

}

}

function changeDay(num){

currentDate.setDate(
currentDate.getDate()+num
);

renderCalendar();

}

function getChapterAccuracy(
subject,
chapter
){

const key =
"accuracy_"+
subject+
"_"+
chapter;

const data =
JSON.parse(
localStorage.getItem(key)
||
'{"attempted":0,"correct":0}'
);

if(data.attempted===0){

return 0;

}

return (
(data.correct/data.attempted)
*100
).toFixed(1);

}
async function saveTaskToCloud(
subject,
chapter,
task,
value,
date
){

if(!window.db) return;

const id =
subject + "_" +
chapter + "_" +
task;

try{

await setDoc(
doc(db,"tasks",id),
{
subject,
chapter,
task,
done:value,
date,
calendarDate:new Date()
.toISOString()
.split('T')[0]
}
);

}catch(error){

console.log(
"Cloud save failed"
);

}

}

async function loadCloudData(){

if(!window.db) return;

try{

const querySnapshot =
await getDocs(
collection(db,"tasks")
);

querySnapshot.forEach(
(documentData)=>{

const data =
documentData.data();

const key =
getKey(
data.subject,
data.chapter,
data.task
);

if(data.done){

localStorage.setItem(
key,
"done"
);

localStorage.setItem(
key+"_date",
data.date
);
const calendarKey =
(
data.calendarDate ||
new Date()
.toISOString()
.split('T')[0]
)
+
"_" +
data.subject;

let arr =
JSON.parse(
localStorage.getItem(calendarKey)
|| "[]"
);

const text =
data.chapter +
" → " +
data.task;

if(!arr.includes(text)){

arr.push(text);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);

}
}else{

localStorage.removeItem(
key
);

localStorage.removeItem(
key+"_date"
);
const calendarKey =
(
data.calendarDate ||
new Date()
.toISOString()
.split('T')[0]
)
+
"_" +
data.subject;
let arr =
JSON.parse(
localStorage.getItem(calendarKey)
|| "[]"
);

const text =
data.chapter +
" → " +
data.task;

arr = arr.filter(
item => item !== text
);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);
}

});

updateProgress();

renderAdmin();

}catch(error){

console.log(
"Cloud load failed"
);

}

}

function fillDateTime(
cb,
subject,
chapter,
task
){

const row =
cb.parentElement
.parentElement;

const input =
row.querySelector(
".dateField"
);

const key =
getKey(
subject,
chapter,
task
);

const today =
new Date()
.toISOString()
.split('T')[0];

const calendarKey =
today + "_" + subject;

const text =
chapter +
" → " +
task;

if(cb.checked){

const now =
new Date();

const formatted =
now.toLocaleDateString()
+" "+
now.toLocaleTimeString();

input.value =
formatted;

localStorage.setItem(
key,
"done"
);

localStorage.setItem(
key+"_date",
formatted
);

saveTaskToCloud(
subject,
chapter,
task,
true,
formatted
);

let arr =
JSON.parse(
localStorage.getItem(
calendarKey
) || "[]"
);

if(!arr.includes(text)){

arr.push(text);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);

}

}else{

input.value = "";

localStorage.removeItem(
key
);

localStorage.removeItem(
key+"_date"
);

saveTaskToCloud(
subject,
chapter,
task,
false,
""
);

let arr =
JSON.parse(
localStorage.getItem(
calendarKey
) || "[]"
);

arr = arr.filter(
item => item !== text
);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);

}

updateProgress();

renderCalendar();

updateSubjectCompletion();

}
function createTable(
subject,
chapter
){

let html = `
<table>

<tr>
<th>Task</th>
<th>Done</th>
<th>Completion Time</th>
</tr>
`;

getTasks(subject)
.forEach(task=>{

const key =
getKey(
subject,
chapter,
task
);

const checked =
localStorage.getItem(key)
? "checked"
: "";

const savedDate =
localStorage.getItem(
key+"_date"
) || "";

html += `

<tr>

<td>${task}</td>

<td>

<input
type="checkbox"
${checked}

onchange="
fillDateTime(
this,
'${subject}',
'${chapter}',
'${task}'
)
">

</td>

<td>

<input
class="dateField"
readonly
value="${savedDate}"
>

</td>

</tr>
`;

});

html += `</table>`;

return html;

}

x=>`<li>${x}</li>`
).join("");

function updateSubjectCompletion(){

for(let subject in allSubjects){

let total = 0;
let done = 0;

allSubjects[subject]
.forEach(ch=>{

getTasks(subject)
.forEach(task=>{

total++;

if(
localStorage.getItem(
getKey(subject,ch,task)
)
){
done++;
}

});

});

const percent =
((done/total)*100)
.toFixed(1);

if(subject==="Physics"){

document.getElementById(
"phyPercent"
).innerText =
percent + "%";

}

if(subject==="Chemistry"){

document.getElementById(
"chemPercent"
).innerText =
percent + "%";

}

if(subject==="Biology"){

document.getElementById(
"bioPercent"
).innerText =
percent + "%";

}

}

}

function showWeakChapters(){

let html = "";

for(let subject in allSubjects){

html += `
<h3 class="subject-title">
${subject}
</h3>
<ul>
`;

allSubjects[subject]
.forEach(ch=>{

const acc =
getChapterAccuracy(
subject,
ch
);

if(acc < 80 && acc > 0){

html += `
<li class="red">
${ch} → ${acc}%
</li>
`;

}

});

html += `</ul>`;

}

document.getElementById(
"weakList"
).innerHTML = html;

}

function saveAccuracy(){

document.getElementById(
"feedSubject"
).value;

document.getElementById(
"feedChapter"
).value;
