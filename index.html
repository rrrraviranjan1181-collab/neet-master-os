<script>

]

};

const tests = {
ut1:{
title:"UNIT TEST 1",
date:"31 May 2026",
chapters:{
Physics:[
"Basic Maths+ Vectors",
"Units and measurements"
],
Chemistry:[
"Some Basic Concepts of Chemistry",
"Structure of Atom"
],
Biology:[
"The Living World",
"Biological Classification",
"Plant Kingdom",
"Animal Kingdom"
]
}
}

};

function getTasks(subject){

if(subject==="Physics") return physicsTasks;
if(subject==="Chemistry") return chemistryTasks;
return biologyTasks;

}

function getKey(subject,chapter,task){

return `${subject}_${chapter}_${task}`;

}

async function saveTaskToCloud(
subject,
chapter,
task,
value,
date
){

const id =
subject+"_"+chapter+"_"+task;

await setDoc(
doc(db,"tasks",id),
{
subject,
chapter,
task,
done:value,
date
}
);

}

function updateProgress(){

let total = 0;
let done = 0;

for(let subject in allSubjects){

allSubjects[subject].forEach(ch=>{

getTasks(subject).forEach(task=>{

total++;

if(localStorage.getItem(
getKey(subject,ch,task)
)){
done++;
}

});

});

}

let percent =
((done/total)*100).toFixed(2);

const bar =
document.getElementById("progressBar");

if(bar){
bar.style.width = percent+"%";
}

const text =
document.getElementById("progressText");

if(text){
text.innerText =
percent+"% Completed";
}

}

function fillDateTime(
cb,
subject,
chapter,
task
){

const row =
cb.parentElement.parentElement;

const input =
row.querySelector(".dateField");

const key =
getKey(subject,chapter,task);

const today =
new Date().toISOString().split('T')[0];

const calendarKey =
today + "_" + subject;

const text =
chapter + " → " + task;

if(cb.checked){

const now = new Date();

const formatted =
now.toLocaleDateString()
+" "+
now.toLocaleTimeString();

input.value = formatted;

localStorage.setItem(
key,
"done"
);

localStorage.setItem(
key+"_date",
formatted
);

saveTaskToCloud(
subject,
chapter,
task,
true,
formatted
);

let arr =
JSON.parse(
localStorage.getItem(calendarKey)
|| "[]"
);

if(!arr.includes(text)){

arr.push(text);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);

}

}else{

input.value="";

localStorage.removeItem(key);

localStorage.removeItem(
key+"_date"
);

saveTaskToCloud(
subject,
chapter,
task,
false,
""
);

let arr =
JSON.parse(
localStorage.getItem(calendarKey)
|| "[]"
);

arr = arr.filter(
item => item !== text
);

localStorage.setItem(
calendarKey,
JSON.stringify(arr)
);

}

updateProgress();

renderCalendar();

}

function createTable(subject,chapter){

let html = `
<table>

<tr>
<th>Task</th>
<th>Done</th>
<th>Completion Time</th>
</tr>
`;

getTasks(subject).forEach(task=>{

const key =
getKey(subject,chapter,task);

const checked =
localStorage.getItem(key)
? "checked"
: "";

const savedDate =
localStorage.getItem(key+"_date")
|| "";

html += `
<tr>

<td>${task}</td>

<td>

<input
type="checkbox"
${checked}
onchange="
fillDateTime(
this,
'${subject}',
'${chapter}',
'${task}'
)
">

</td>

<td>

<input
class="dateField"
readonly
value="${savedDate}"
>

</td>

</tr>
`;

});

html += `</table>`;

return html;

}

let currentDate =
new Date();

function changeDay(num){

currentDate.setDate(
currentDate.getDate()+num
);

renderCalendar();

}

function renderCalendar(){

const d =
currentDate.toISOString().split('T')[0];

document.getElementById(
"calendarDate"
).innerText =
currentDate.toDateString();

["Physics","Chemistry","Biology"]
.forEach(sub=>{

const data =
JSON.parse(
localStorage.getItem(
d+"_"+sub
)
|| "[]"
);

document.getElementById(
sub+"Log"
).innerHTML =
data.map(
x=>`<li>${x}</li>`
).join("");

});

}

function getChapterAccuracy(
subject,
chapter
){

const key =
"accuracy_"+subject+"_"+chapter;

const data =
JSON.parse(
localStorage.getItem(key)
|| '{"attempted":0,"correct":0}'
);

if(data.attempted===0)
return 0;

return (
(data.correct/data.attempted)*100
).toFixed(1);

}

function updateSubjectCompletion(){

for(let subject in allSubjects){

let total = 0;
let done = 0;

allSubjects[subject]
.forEach(ch=>{

getTasks(subject)
.forEach(task=>{

total++;

if(localStorage.getItem(
getKey(subject,ch,task)
)){
done++;
}

});

});

const percent =
((done/total)*100)
.toFixed(1);

if(subject==="Physics"){
document.getElementById(
"phyPercent"
).innerText =
percent+"%";
}

if(subject==="Chemistry"){
document.getElementById(
"chemPercent"
).innerText =
percent+"%";
}

if(subject==="Biology"){
document.getElementById(
"bioPercent"
).innerText =
percent+"%";
}

}

}

function showWeakChapters(){

let html = "";

for(let subject in allSubjects){

html += `
<h3 class="subject-title">
${subject}
</h3>
<ul>
`;

allSubjects[subject]
.forEach(ch=>{

const acc =
getChapterAccuracy(
subject,
ch
);

if(acc<80 && acc>0){

html += `
<li class="red">
${ch} → ${acc}%
</li>
`;

}

});

html += `</ul>`;

}

document.getElementById(
"weakList"
).innerHTML = html;

}

function renderFull(){

let html = `
<div class="card">

<h2>
FULL SYLLABUS PROGRESS
</h2>
`;

for(let subject in allSubjects){

html += `
<h2 class="subject-title">
${subject}
</h2>
`;

allSubjects[subject]
.forEach(ch=>{

html += `
<div class="chapter">

<h3>${ch}</h3>

${createTable(subject,ch)}

</div>
`;

});

}

html += `</div>`;

document.getElementById(
"content"
).innerHTML = html;

}

function renderUT(key){

const test = tests[key];

let html = `
<div class="card">

<h2>${test.title}</h2>

<h3>${test.date}</h3>
`;

for(let subject in test.chapters){

html += `
<h2 class="subject-title">
${subject}
</h2>
`;

test.chapters[subject]
.forEach(ch=>{

html += `
<div class="chapter">

<h3>${ch}</h3>

${createTable(subject,ch)}

</div>
`;

});

}

html += `</div>`;

document.getElementById(
"content"
).innerHTML = html;

}

function resetAllData(){

const first =
confirm(
"Reset all data?"
);

if(!first) return;

const second =
confirm(
"Permanent delete?"
);

if(!second) return;

localStorage.clear();

alert("All data reset.");

location.reload();

}

document.getElementById(
"mainSelect"
).addEventListener(
"change",
e=>{

const val = e.target.value;

if(val==="admin"){
renderAdmin();
}

else if(val==="full"){
renderFull();
}

else{
renderUT(val);
}

}
);

renderAdmin();

</script>

<script type="module">

</script>
